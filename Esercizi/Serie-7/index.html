<!DOCTYPE html>
<html lang="it">

    <!-- Nicola Galeano
         version: 12.03.2026 -->
    <!-- Mini Ecommerce Fast-Food -->

<head>
    <meta charset="UTF-8">
    <title>Mini Ecommerce Fast-Food</title>

    <!-- collegamento al file CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- collegamento al file JavaScript -->
    <script src="js/script.js" defer></script>

</head>

<body>

    <!-- Titolo della pagina -->
    <header>
        <h1>🍔 Fast-Food Menu</h1>
    </header>


    <!-- Contenitore principale -->
    <main>

        <!-- Sezione che conterrà i prodotti generati con JavaScript -->
        <section class="products">

            <!--
            Le card dei prodotti verranno inserite dinamicamente
            tramite JavaScript utilizzando l'oggetto prodotti
            -->

        </section>


        <!-- Sezione carrello -->
        <aside class="cart">

            <h2>Carrello</h2>

            <!-- Lista dei prodotti acquistati -->
            <ul id="cart-list">

                <!--
                Qui verranno aggiunti gli elementi del carrello
                tramite JavaScript
                -->

            </ul>

            <!-- Totale del carrello -->
            <p id="totale">
                Totale: CHF 0.00
            </p>

        </aside>

    </main>


</body>
</html>
