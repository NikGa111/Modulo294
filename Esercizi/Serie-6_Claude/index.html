<!DOCTYPE html>
<html lang="it">

    <!-- Nicola Galeano 
         version: 05.03.2026 -->
    <!-- Serie 6 -->

    <!-- Parte 0 -->
<head>
    <meta charset="UTF-8">
    <title>Mini Ecommerce</title>

    <!-- collegamento al file CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- collegamento al file JavaScript -->
    <script src="js/script.js" defer></script>

</head>

<body>

    <!-- Titolo della pagina -->
    <header>
        <h1>Mini Ecommerce</h1>
    </header>


    <!-- Contenitore principale -->
    <main>

        <!-- Parte 2 -->
        <!-- Sezione che conterrà i prodotti generati con JavaScript -->
        <section class="products">

            <!--
            Le card dei prodotti verranno inserite dinamicamente
            tramite JavaScript utilizzando l'array products
            -->

        </section>


        <!-- Parte 4 -->
        <!-- Sezione carrello -->
        <aside class="cart">

            <h2>Carrello</h2>

            <!-- Lista dei prodotti acquistati -->
            <ul id="cart-list">

                <!--
                Qui verranno aggiunti gli elementi del carrello
                tramite JavaScript
                -->

            </ul>

            <!-- Parte 5 -->
            <!-- Totale del carrello -->
            <p id="totale">
                Totale: CHF 0.00
            </p>

        </aside>

    </main>


</body>
</html>
