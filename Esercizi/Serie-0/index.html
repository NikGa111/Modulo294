<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serie-0</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<main class="container">
    <h1>Let's level up your brand, together</h1>

    <form action="#" method="get">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@company.com">
        </div>

        <div class="form-group">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="+1(555)000-0000">
        </div>

        <div class="form-group">
            <label for="description">How can we help?</label>
            <textarea id="description" name="description" placeholder="Tell us a little about the project..."></textarea>
        </div>

        <div class="services-title">Services</div>

        <div class="checkbox-group">
            <input type="checkbox" id="web-design" name="services" value="web-design">
            <label for="web-design" class="ckbox-item">Website design</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="ux-design" name="services" value="ux-design">
            <label for="ux-design" class="ckbox-item">UX design</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="user-research" name="services" value="user-research">
            <label for="user-research" class="ckbox-item">User research</label>
        </div>

        <button type="submit" class="btn-submit">Get started</button>
    </form>
</maim>

</body>
</html>
