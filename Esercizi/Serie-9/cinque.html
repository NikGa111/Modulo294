<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinque</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        button {
            padding: 4px 8px;
            margin-block: 4px;
        }


        table {
            border-collapse: collapse;
        }

        table tr.active {
            background-color: lightblue;
        }

        table tr td {
            border: 1px solid black;
            padding: 4px 8px;
        }

        .favorite {
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <table>
        <tbody id="list"></tbody>
    </table>

    <script>

        const users = [
            { name: "Mario", active: false },
            { name: "Laura", active: true },
            { name: "Giulia", active: false }
        ];

        const list = document.getElementById('list');


        function renderList() {
            // Svuoto la lista prima di rigenerarla
            list.innerHTML = '';
            let html = "";

            users.forEach((user, index) => {
                html += `
                <tr class="${user.active ? 'active' : ''}" data-id="${index}">
                    <td>${user.name}</td>
                    <td>
                        <button class="btn-modify"><i class="bi bi-pencil-fill"></i></button>
                        <button class="btn-active"><i class="bi bi-star-fill"></i></button>
                        <button class="btn-delete"><i class="bi bi-trash3"></i></button>
                    </td>
                </tr>`;
            })

            list.innerHTML = html;
        }

        list.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return; // Early return: click fuori dai bottoni, esci.

            const index = Number(btn.closest('tr').dataset.id);

            // Ho già il riferimento al bottone (btn),
            // quindi posso controllare direttamente le sue classi.
            if (btn.classList.contains('btn-modify')) {

                const name = prompt("Modifica il nome dell'utente:", users[index].name);
                if (name === null || name.trim() === '') return; // utente ha cliccato Annulla o ha inserito spazi vuoti

                users[index].name = name;
                renderList();
            }

            if (btn.classList.contains('btn-active')) {
                users[index].active = !users[index].active;
                console.log(index)
                renderList();
            }

            if (btn.classList.contains('btn-delete')) {
                users.splice(index, 1)
                renderList();
            }
        })

        renderList();

    </script>
</body>

</html>
