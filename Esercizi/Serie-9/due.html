<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Due</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        button {
            padding: 4px 8px;
            margin-left: 4px;
        }

        .done {
            text-decoration: line-through;
        }
    </style>
</head>

<body>

    <ul id="list">

    </ul>

    <script>

        const todoData = [
            { text: "Studiare JavaScript", done: false },
            { text: "Fare gli esercizi", done: true }
        ];

        const list = document.getElementById('list');


        function renderList() {
            // Svuoto la lista prima di rigenerarla
            list.innerHTML = '';
            let html = "";
            let i = 0;

            for (let todo of todoData) {

                html += `
                <li>
                    <span class="${(todo.done) ? 'done' : ''}">${todo.text}</span>
                    <button data-id="${i}">
                        <i class="bi bi-check"></i>
                    </button>
                </li>`;
                i++;
            }
            list.innerHTML = html;
        }

        list.addEventListener('click', (e) => {

            const btn = e.target.closest('button')

            if (!btn) return; // Early return → codice più compatto, leggibile e non annidato dentro un if            
            
            const index = Number(btn.dataset.id);
            todoData[index].done = !todoData[index].done
            renderList();
            console.log(todoData)


        })

        renderList();



    </script>
</body>

</html>
