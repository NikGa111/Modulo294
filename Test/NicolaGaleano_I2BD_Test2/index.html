<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test 3</title>
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Test 3</h1>
    </header>

    <section class="panel">
      <div class="panel-header">
        <div>
          <p class="section-label">Esercizio 1</p>
          <h2>Statistiche biblioteca</h2>
        </div>
        <button id="btn-analizza-biblioteca" class="button">Analizza biblioteca</button>
      </div>

      <div id="info-biblioteca" class="info-grid"></div>
      <div id="biblioteca" class="grid cards-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <p class="section-label">Esercizio 2</p>
          <h2>Votazioni snack</h2>
        </div>
        <button id="reset-voti" class="button button-secondary">Reset votazioni</button>
      </div>

      <div class="button-row">
        <button class="button chip vote-snack" data-nome="Cookies" data-categoria="Dolce">Cookies</button>
        <button class="button chip vote-snack" data-nome="Popcorn" data-categoria="Salato">Popcorn</button>
        <button class="button chip vote-snack" data-nome="Nachos" data-categoria="Salato">Nachos</button>
        <button class="button chip vote-snack" data-nome="Muffin" data-categoria="Dolce">Muffin</button>
        <button class="button chip vote-snack" data-nome="Frutta secca" data-categoria="Healthy">Frutta secca</button>
      </div>

      <div class="info-grid info-grid-small">
        <article class="info-card">
          <span class="info-title">Snack più votato</span>
          <strong id="top-snack">Nessun voto</strong>
        </article>
        <article class="info-card">
          <span class="info-title">Totale voti</span>
          <strong id="totale-voti">0</strong>
        </article>
      </div>

      <div id="risultati-voti" class="stack-list"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <p class="section-label">Esercizio 3</p>
          <h2>Menù ristorante con sconto e filtro live</h2>
        </div>
        <button id="btn-mostra-menu" class="button">Mostra menù scontato</button>
      </div>

      <div class="toolbar">
        <div class="search-input-wrapper">
          <span class="search-icon">⌕</span>
          <input type="text" id="input-cerca-piatto" placeholder="Cerca un piatto...">
        </div>
      </div>

      <div id="risparmio-menu" class="info-grid info-grid-small"></div>
      <div id="menu-scontato" class="grid cards-grid"></div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
